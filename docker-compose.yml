name: bookbot

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookbot}
      POSTGRES_DB: ${POSTGRES_DB:-bookbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: bookbot-backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./seed:/seed:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://bookbot:bookbot@postgres:5432/bookbot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: bookbot-backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://bookbot:bookbot@postgres:5432/bookbot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: bookbot-frontend
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    environment:
      BOOKBOT_BACKEND_URL: ${BOOKBOT_BACKEND_URL:-http://backend:8000}
      BOOKBOT_API_MODE: ${BOOKBOT_API_MODE:-real}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data: