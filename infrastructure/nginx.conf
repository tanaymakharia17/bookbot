# Gateway in front of Streamlit + Django.
#
# - tolerates stale/broken clients that prefix Streamlit endpoints with an old
#   page path (e.g. /New_Submission/_stcore/health)
# - redirects unknown page paths back to "/"
# - proxies the Streamlit websocket and the Django API on one port
# - tuned for large file uploads (no request buffering limits)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    absolute_redirect off;

    client_max_body_size 200m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;

    # ---- Django backend API (incl. the upload page) ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Streamlit: strip a stray base path before _stcore ----
    location ~ ^/.+/(_stcore/.*)$ {
        proxy_pass http://frontend:8501/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /_stcore/ {
        proxy_pass http://frontend:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location /static/ {
        proxy_pass http://frontend:8501;
        proxy_set_header Host $http_host;
    }

    location = / {
        proxy_pass http://frontend:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # any other page path (e.g. /New_Submission) -> app root
    location / {
        return 302 /;
    }
}