# Gateway in front of Streamlit.
#
# Purpose: tolerate stale/broken clients that prefix Streamlit's internal
# endpoints with an old page path (e.g. /New_Submission/_stcore/health).
# It strips the stray prefix, redirects unknown page paths to "/", and proxies
# the real app (including the websocket) to the frontend service.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    absolute_redirect off;

    client_max_body_size 200m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # strip a stray base path in front of _stcore (old multipage clients)
    location ~ ^/.+/(_stcore/.*)$ {
        proxy_pass http://frontend:8501/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /_stcore/ {
        proxy_pass http://frontend:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        proxy_pass http://frontend:8501;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://frontend:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # any other page path (e.g. /New_Submission) -> send to the app root
    location / {
        return 302 /;
    }
}